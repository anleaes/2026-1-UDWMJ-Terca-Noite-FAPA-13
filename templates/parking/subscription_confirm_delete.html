{% extends 'base.html' %}

{% block title %}Excluir Assinatura{% endblock %}

{% block content %}
<h1>Excluir Assinatura</h1>
<div class="confirm-box">
    <p>Deseja excluir a assinatura de <strong>{{ subscription.customer }}</strong>?</p>
</div>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn-danger">Confirmar</button>
    <a href="{% url 'list_subscriptions' %}"><button type="button">Cancelar</button></a>
</form>
{% endblock %}
