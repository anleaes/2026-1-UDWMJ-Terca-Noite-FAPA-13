{% extends 'base.html' %}

{% block title %}Excluir Vaga{% endblock %}

{% block content %}
<h1>Excluir Vaga</h1>
<div class="confirm-box">
    <p>Deseja excluir a vaga <strong>{{ spot.number }}</strong>?</p>
</div>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn-danger">Confirmar</button>
    <a href="{% url 'list_parking_spots' %}"><button type="button">Cancelar</button></a>
</form>
{% endblock %}
